<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>todos / sheet-backed</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #131313;
    --line: #2a2a2a;
    --fg: #ededed;
    --muted: #6b6b6b;
    --accent: #39ff88;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 16px; margin: 0; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status {
    color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .status.error { color: var(--danger); }
  .divider {
    border-top: 1px dashed var(--line);
    margin: 16px 0 20px;
  }
  form.add { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; padding: 8px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg-2); color: var(--fg); outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 12px -4px rgba(57, 255, 136, 0.55);
  }
  button.primary {
    padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--bg);
    border: 1px solid var(--accent); border-radius: 6px;
  }
  button.primary:hover { background: #5fff9f; border-color: #5fff9f; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 6px;
  }
  li:hover { background: rgba(255,255,255,0.03); }
  li input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--accent); cursor: pointer;
  }
  li .title { flex: 1; word-break: break-word; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li button.rm {
    opacity: 0; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 11px; cursor: pointer; padding: 4px 8px;
  }
  li:hover button.rm { opacity: 1; }
  li button.rm:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 12px; padding: 16px 12px; }
  .config-warning {
    margin-top: 12px; padding: 12px;
    border: 1px dashed var(--danger); border-radius: 6px;
    color: var(--danger); font-size: 12px;
  }
  code { background: var(--bg-2); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>[ todos ]</h1>
    <span class="status" id="status">loading…</span>
  </header>
  <div class="divider"></div>

  <form class="add" id="add-form">
    <input
      type="text"
      id="draft"
      placeholder="what needs doing?"
      autocomplete="off"
      autofocus
      required>
    <button class="primary">[ add ]</button>
  </form>

  <ul id="list"></ul>

  <div class="config-warning" id="config-warning" hidden>
    <strong>setup needed:</strong> open <code>index.html</code> and set
    <code>SHEET_API</code> to your deployed Apps Script Web App URL.
    See <code>README.md</code> in this folder for the 5-minute setup.
  </div>
</main>

<script>
  /* ====================================================================
     CONFIG
     ====================================================================
     Paste your deployed Apps Script Web App URL here. See README.md and
     apps-script.gs in this folder for setup instructions.
  */
  const SHEET_API = "REPLACE_ME_WITH_YOUR_APPS_SCRIPT_URL";

  /* ====================================================================
     State + DOM refs
  */
  const $list = document.getElementById("list");
  const $status = document.getElementById("status");
  const $form = document.getElementById("add-form");
  const $draft = document.getElementById("draft");
  const $warn = document.getElementById("config-warning");
  let items = [];

  /* ====================================================================
     CRUD against the Apps Script

     Important: Apps Script Web Apps don't handle CORS preflight nicely,
     so all writes are POSTs with Content-Type: text/plain and a JSON body.
     That keeps the browser in "simple request" mode (no preflight). The
     `op` field in the body picks the verb.
  */
  async function api(op, payload) {
    if (!op) {
      const res = await fetch(SHEET_API, { redirect: "follow" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    const res = await fetch(SHEET_API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ op, ...payload }),
      redirect: "follow",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error + ": " + (data.message || ""));
    return data;
  }

  /* ====================================================================
     Helpers
  */
  function isDone(t) {
    // Sheets sometimes returns booleans as the strings "TRUE"/"FALSE".
    return t.done === true || t.done === "TRUE" || t.done === "true";
  }

  function setStatus(msg, isError) {
    $status.textContent = msg;
    $status.classList.toggle("error", !!isError);
  }

  function itemCount() {
    return items.length + " item" + (items.length === 1 ? "" : "s");
  }

  function render() {
    $list.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "nothing yet. add one above.";
      $list.appendChild(empty);
      return;
    }
    for (const t of items) {
      const li = document.createElement("li");
      if (isDone(t)) li.classList.add("done");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isDone(t);
      cb.addEventListener("change", () => toggle(t));

      const span = document.createElement("span");
      span.className = "title";
      span.textContent = t.title;

      const rm = document.createElement("button");
      rm.className = "rm";
      rm.textContent = "[ rm ]";
      rm.addEventListener("click", () => remove(t));

      li.append(cb, span, rm);
      $list.appendChild(li);
    }
  }

  /* ====================================================================
     Actions — optimistic UI, rollback on failure
  */
  async function load() {
    try {
      items = await api();
      setStatus(itemCount());
      render();
    } catch (err) {
      setStatus("load failed — see console", true);
      console.error(err);
    }
  }

  async function add(title) {
    const temp = { id: "_tmp_" + Date.now(), title, done: false };
    items.push(temp);
    render();
    try {
      const created = await api("create", { row: { title, done: false } });
      const idx = items.findIndex(x => x.id === temp.id);
      if (idx !== -1) items[idx] = created;
      setStatus(itemCount());
      render();
    } catch (err) {
      items = items.filter(x => x.id !== temp.id);
      setStatus("add failed", true);
      render();
      console.error(err);
    }
  }

  async function toggle(t) {
    const before = t.done;
    const next = !isDone(t);
    t.done = next;
    render();
    try {
      await api("update", { id: t.id, row: { done: next } });
    } catch (err) {
      t.done = before;
      setStatus("update failed", true);
      render();
      console.error(err);
    }
  }

  async function remove(t) {
    const before = items.slice();
    items = items.filter(x => x.id !== t.id);
    render();
    try {
      await api("delete", { id: t.id });
      setStatus(itemCount());
    } catch (err) {
      items = before;
      setStatus("delete failed", true);
      render();
      console.error(err);
    }
  }

  /* ====================================================================
     Bootstrap
  */
  $form.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $draft.value.trim();
    if (!title) return;
    $draft.value = "";
    add(title);
  });

  if (SHEET_API === "REPLACE_ME_WITH_YOUR_APPS_SCRIPT_URL") {
    setStatus("not configured", true);
    $warn.hidden = false;
  } else {
    load();
  }
</script>
</body>
</html>
